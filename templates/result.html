<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AQI Prediction Result</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; text-align: center; }
        .result-box { border: 2px solid #333; padding: 20px; display: inline-block; border-radius: 10px; background-color: #f9f9f9; }
        h1 { color: #2c3e50; }
        .prediction { font-size: 24px; color: #e74c3c; font-weight: bold; }
        a { display: inline-block; margin-top: 20px; text-decoration: none; color: white; background-color: #3498db; padding: 10px 20px; border-radius: 5px; }
        a:hover { background-color: #2980b9; }
    </style>
</head>
<body>

    <div class="result-box">
        <h1>Prediction Complete! 🎯</h1>
        <p>Based on the sky image and pollutant data provided, the predicted Air Quality is:</p>
        
        <p class="prediction">{{ prediction }}</p>
        <p><strong>Model Confidence:</strong> {{ confidence }}%</p>
        
        <a href="/">⬅️ Try Another Prediction</a>
    </div>

</body>
</html>
